name: Previsioni Kronos
on:
  schedule:
    - cron: "30 22 * * 1-5"    # dopo la chiusura di Wall Street
    - cron: "30 10 * * 0,6"    # weekend (crypto)
    - cron: "0 3 * * 0"        # domenica: anche il backtest
  workflow_dispatch:
    inputs:
      backtest:
        description: "Rifai anche il test sul passato (lento)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: previsioni
  cancel-in-progress: false
jobs:
  previsioni:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-v1
      - name: Installa
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          git clone -q --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos
      - name: Previsioni
        run: python -m pipeline.run_forecast
      - name: Salva previsioni
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data state
          git diff --cached --quiet && exit 0
          git commit -qm "Dati: previsioni [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
      - name: Test sul passato (a pezzi, max 150 minuti)
        if: github.event.schedule == '0 3 * * 0' || inputs.backtest
        continue-on-error: true
        timeout-minutes: 170
        env:
          BUDGET_MIN: "150"
        run: python -m pipeline.run_backtest
      - name: Salva test
        if: always()
        run: |
          git add site/data state
          git diff --cached --quiet && exit 0
          git commit -qm "Dati: test sul passato [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
  pubblica:
    needs: previsioni
    uses: ./.github/workflows/deploy.yml
