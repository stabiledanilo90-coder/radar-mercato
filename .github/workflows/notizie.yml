name: Notizie e prezzi
on:
  schedule:
    - cron: "*/10 * * * *"     # ogni 10 minuti (GitHub può ritardare di qualche minuto)
    - cron: "40 13 * * 1-5"    # radar occasioni, giorni di borsa
  workflow_dispatch:
    inputs:
      occasioni:
        description: "Aggiorna anche il radar occasioni"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dati
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: Installa
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt transformers
      - name: Aggiorna notizie
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 13 * * 1-5" ] || [ "${{ inputs.occasioni }}" = "true" ]; then
            python -m pipeline.run_news --occasioni
          else
            python -m pipeline.run_news
          fi
      - name: Salva
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data state
          git diff --cached --quiet && exit 0
          git commit -qm "Dati: notizie e prezzi [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
  pubblica:
    needs: aggiorna
    uses: ./.github/workflows/deploy.yml
